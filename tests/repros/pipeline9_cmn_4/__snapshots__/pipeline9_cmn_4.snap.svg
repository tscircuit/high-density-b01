95705501 358.93061917025693,59.63096195705501 364.6959245069959,59.63096195705501 364.6959245069959,63.20011016077327 364.6959245069959,68.91074728672247" fill="none" stroke="red" stroke-width="5.6731657537317055"/></g><g><polyline data-points="3.9003480278422273,-0.6385733157199454 3.9003480278422273,-0.5379128137384398 4.001972157772622,-0.5379128137384398 3.9624999999999995,-0.4749999999999998" data-type="line" data-label="B01 route source_net_0_mst2 z=1" points="364.6959245069959,68.91074728672247 364.6959245069959,63.20011016077327 370.4612298437348,63.20011016077327 368.2219089067195,59.63096195705508" fill="none" stroke="blue" stroke-width="5.6731657537317055"/></g><g><rect data-type="rect" data-label="" data-x="3.4875" data-y="-5.2375" x="185.97145906808848" y="59.63096195705507" width="310.60582501681085" height="540.3690380429449" fill="none" stroke="gray" stroke-width="0.017626842637943695"/></g><circle data-type="circle" data-label="" data-x="3.9003480278422273" data-y="-0.6385733157199454" cx="364.6959245069959" cy="68.91074728672247" r="8.509748630597556" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.017626842637943695"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56.73165753731705,"c":0,"e":143.4227159151007,"b":0,"d":-56.73165753731705,"f":32.68342462682949};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
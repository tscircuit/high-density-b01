19,10.152445354446902 -6.959167897587389,10.152445354446902" data-type="line" data-label="B01 route source_net_50 z=0" points="320,320 328.51994091580514,318.0087432884943 344.6065977351061,318.0087432884943 360.6932545544066,318.0087432884943 376.7799113737078,318.0087432884943 392.86656819300833,318.0087432884943 408.9532250123093,318.0087432884943 425.03988183161005,318.0087432884943 441.1265386509108,318.0087432884943 457.21319547021176,318.0087432884943 473.2998522895125,318.0087432884943 489.38650910881347,318.0087432884943 505.4731659281142,318.0087432884943 521.559822747415,318.0087432884943 537.6464795667159,318.0087432884943 553.7331363860167,318.0087432884943" fill="none" stroke="red" stroke-width="14.879999999999999"/></g><g><rect data-type="rect" data-label="" data-x="-8.419999999999993" data-y="10.139999999999992" x="40" y="40" width="560" height="560" fill="transparent" stroke="none" stroke-width="0.00625"/></g><circle data-type="circle" data-label="" data-x="-8.203615635237746" data-y="9.788467989905874" cx="354.62149836195954" cy="376.2451216150589" r="39.44" fill="rgba(245,174,49,0.24)" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-8.185472552833778" data-y="9.939998999999991" cx="357.5243915465944" cy="352.00016000000005" r="39.44" fill="rgba(245,174,49,0.24)" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-8.185472552833778" data-y="9.939998999999991" cx="357.5243915465944" cy="352.00016000000005" r="39.44" fill="rgba(245,174,49,0.24)" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-8.219998999999996" data-y="9.741" cx="352.0001599999996" cy="383.8399999999988" r="39.44" fill="rgba(245,174,49,0.24)" stroke="none" stroke-width="0.00625"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":160,"c":0,"e":1667.199999999999,"b":0,"d":-160,"f":1942.3999999999987};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
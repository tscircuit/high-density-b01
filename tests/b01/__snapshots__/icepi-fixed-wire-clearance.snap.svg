<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><circle data-type="point" data-label="" data-x="17.299999999999994" data-y="2.9499999999999824" cx="292.63996433681996" cy="320.00000000000006" r="3" fill="#124d65"/></g><g><polyline data-points="16.989509352774938,3.2895093527749273 19.75908445956383,3.2895093527749273" data-type="line" data-label="" points="257.77669942932926,281.87838632129836 568.75685774368,281.87838632129836" fill="none" stroke="#fde6ad" stroke-width="62.48628451264009"/></g><g><polyline data-points="16.989509352774938,3.2895093527749273 19.75908445956383,3.2895093527749273" data-type="line" data-label="fixed obstacle source_net_18 z=0" points="257.77669942932926,281.87838632129836 568.75685774368,281.87838632129836" fill="none" stroke="#374151" stroke-width="17.57251307498324"/></g><g><polyline data-points="17.299999999999994,2.9499999999999824 17.2644191476941,2.8554711246200437 17.2644191476941,2.7550151975683717" data-type="line" data-label="B01 route source_net_16 z=0" points="292.63996433681996,320.00000000000006 288.64478866675995,330.61412075768334 288.64478866675995,341.8937571255752" fill="none" stroke="red" stroke-width="13.923269145673624"/></g><g><polyline data-points="17.2644191476941,2.7550151975683717 17.2644191476941,2.8554711246200437 17.2644191476941,2.955927051671715 17.2644191476941,3.056382978723387 17.2644191476941,3.156838905775059 17.2644191476941,3.257294832826731 17.2644191476941,3.357750759878402 17.2644191476941,3.4582066869300743 17.2644191476941,3.5586626139817463 17.2644191476941,3.6591185410334175 17.2644191476941,3.7595744680850904" data-type="line" data-label="B01 route source_net_16 z=1" points="288.64478866675995,341.8937571255752 288.64478866675995,330.61412075768334 288.64478866675995,319.33448438979167 288.64478866675995,308.05484802189983 288.64478866675995,296.775211654008 288.64478866675995,285.49557528611615 288.64478866675995,274.2159389182245 288.64478866675995,262.93630255033264 288.64478866675995,251.6566661824408 288.64478866675995,240.37702981454908 288.64478866675995,229.09739344665718" fill="none" stroke="blue" stroke-width="13.923269145673624"/></g><g><polyline data-points="17.2644191476941,3.7595744680850904 17.2644191476941,3.8600303951367616 17.2644191476941,3.9604863221884337 17.2644191476941,4.060942249240105 17.2644191476941,4.161398176291777 17.2644191476941,4.261854103343449 17.2644191476941,4.36231003039512 17.2644191476941,4.462765957446793 17.2644191476941,4.563221884498464 17.2644191476941,4.663677811550135 17.2644191476941,4.764133738601808" data-type="line" data-label="B01 route source_net_16 z=0" points="288.64478866675995,229.09739344665718 288.64478866675995,217.81775707876545 288.64478866675995,206.5381207108736 288.64478866675995,195.2584843429819 288.64478866675995,183.9788479750901 288.64478866675995,172.69921160719827 288.64478866675995,161.41957523930654 288.64478866675995,150.13993887141464 288.64478866675995,138.86030250352292 288.64478866675995,127.58066613563119 288.64478866675995,116.30102976773924" fill="none" stroke="red" stroke-width="13.923269145673624"/></g><g><rect data-type="rect" data-label="" data-x="17.299999999999994" data-y="2.9499999999999824" x="40" y="67.36003566318027" width="505.27992867363946" height="505.2799286736396" fill="transparent" stroke="none" stroke-width="0.008905954392078278"/></g><circle data-type="circle" data-label="" data-x="16.989509352774938" data-y="3.2895093527749273" cx="257.77669942932926" cy="281.87838632129836" r="31.243142256320045" fill="rgba(245,174,49,0.24)" stroke="none" stroke-width="0.008905954392078278"/><circle data-type="circle" data-label="" data-x="19.75908445956383" data-y="3.2895093527749273" cx="568.75685774368" cy="281.87838632129836" r="31.243142256320045" fill="rgba(245,174,49,0.24)" stroke="none" stroke-width="0.008905954392078278"/><circle data-type="circle" data-label="" data-x="17.2644191476941" data-y="2.7550151975683717" cx="288.64478866675995" cy="341.8937571255752" r="25.263996433681978" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.008905954392078278"/><circle data-type="circle" data-label="" data-x="17.2644191476941" data-y="3.7595744680850904" cx="288.64478866675995" cy="229.09739344665718" r="25.263996433681978" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.008905954392078278"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":112.28442859414213,"c":0,"e":-1649.8806503418382,"b":0,"d":-112.28442859414213,"f":651.2390643527174};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>